name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Cordova globally
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create kws-app com.kamalwebstudio.manager "KWS Client Manager"
        cd kws-app
        cordova platform add android

    - name: Copy index.html to Cordova Project
      run: |
        cp index.html kws-app/www/index.html

    - name: Build Debug APK
      run: |
        cd kws-app
        cordova build android --debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: KWS-Client-Manager-APK
        path: kws-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk